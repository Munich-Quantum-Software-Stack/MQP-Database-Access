on:
  issues:
    types: [opened, closed]

permissions:
  issues: write

jobs:
  create-jira-issue:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Create Issue in Jira
        id: create_jira
        uses: atlassian/gajira-create@v3
        with:
          project: QSI
          issuetype: Task
          summary: "${{ github.event.issue.title }}"
          description: |
            GitHub Issue: ${{ github.event.issue.html_url }}
            Author: ${{ github.event.issue.user.login }}

            ${{ github.event.issue.body }}

      - name: Comment Jira Key on GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Tracked in Jira: [${{ steps.create_jira.outputs.issue }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ steps.create_jira.outputs.issue }})`
            })

  close-jira-issue:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Find Jira key in issue comments
        id: key
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              const m = c.body.match(/Tracked in Jira: \[([A-Z]+-\d+)\]/);
              if (m) { core.setOutput('key', m[1]); return; }
            }
            core.setFailed('No Jira key found in the issue comments');

      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Move Jira item to Done
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.key.outputs.key }}
          transition: Done