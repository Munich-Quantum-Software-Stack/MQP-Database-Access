name: Update docs

on:
  push:
    branches:
      - develop

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Build documentation
        run: uv run mkdocs build
        # Output goes to: build/docs/site/

      - name: Checkout MQP Database Access repository
        run: |
          git clone https://x-access-token:${{ secrets.MQSS_INTERFACES_DOCS_TOKEN }}@github.com/Munich-Quantum-Software-Stack/MQSS-Interfaces.git
          git remote set-url origin https://x-access-token:${{ secrets.MQSS_INTERFACES_DOCS_TOKEN }}@github.com/Munich-Quantum-Software-Stack/MQSS-Interfaces.git
          cd MQSS-Interfaces
          git checkout gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin gh-pages

      - name: Copy documentation to MQSS Interfaces repository
        run: |
          cd MQSS-Interfaces
          rm -rf bqp_database_access/*
          mkdir -p bqp_database_access/
          cp -r ../build/docs/site/* bqp_database_access/

      - name: Commit and push changes to MQSS Interfaces repository
        run: |
          cd MQSS-Interfaces
          git add .
          git commit -m "Update MQP Database Access docs from GitHub Action" || echo "No changes to commit"
          git push origin gh-pages
