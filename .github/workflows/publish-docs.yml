name: Build and Deploy Docs

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # gh-pages is pushed with an explicit token below

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Add UV to the environment
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build documentation
        run: uv run mkdocs build

      - name: Copy documentation to gh-pages branch
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
          cp -rf build/docs/site/* gh-pages/

      - name: Commit and push changes
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update docs from GitHub Action" || echo "No changes to commit"
          git push origin gh-pages

      - name: Clean up
        run: |
          cd ..
          rm -rf gh-pages
          rm -rf build