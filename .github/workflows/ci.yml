name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      QUANTUM_DB_TESTING: "TRUE"
      QUANTUM_DB_FILENAME: test_db.sqlite
      QUANTUM_DB_USER: postgres
      QUANTUM_DB_PASS: example
      QUANTUM_DB_HOST: localhost:5432
      QUANTUM_DB_PEPPER: ci-test-pepper
      QUANTUM_DB_TOKEN_PEPPER: ci-test-token-pepper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Type checking
        run: uv run mypy bqp_database_access/

      - name: Linting
        run: uv run pylint bqp_database_access/

      - name: Tests
        run: uv run pytest

      - name: Run Pytest with coverage
        run:
          uv run pytest --maxfail=1 --disable-warnings --cov=bqp_database_access
          --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
