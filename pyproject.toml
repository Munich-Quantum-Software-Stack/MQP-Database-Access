[project]
name = "bqp-database-access"
version = "0.3.33"
description = ""
authors = [
    { name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de" },
    { name = "Tobias Bauer", email = "Tobias.Bauer@lrz.de" },
    { name = "Ege Özmeral", email = "Nazim.Oezmeral@lrz.de" },
    { name = "Trang Huynh", email = "Trang.Huynh@lrz.de" },
]
keywords = ["MQSS", "database", "MQP"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pony>=0.7.19",
    "bcrypt>=4.0",
    "psycopg2-binary>=2.9.10",
    "numpy>=2.2.6",
    "eliot>=1.17.5",
    "cffi>=2.0.0",
    "werkzeug>=3.1.4",
    "fixture>=1.5.11",
    "python-dotenv>=1.2.2",
    ]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools]
packages = ["bqp_database_access"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.isort]
profile = "black"

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "too-many-arguments",
    "too-many-nested-blocks",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-function-args",
    "W0511",
    "import-outside-toplevel",
    "missing-docstring",
    "E1101",
]

[tool.pylint.'SIMILARITIES']
min-similarity-lines = 8
ignore-imports = "yes"

[tool.pylint.'FORMAT']
max-line-length = 95
max-positional-arguments = 10

[tool.black]
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "-s"]


[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "mypy>=1.14.1",
    "pylint>=3.3.8",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.11.5",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.2",
    "mkdocstrings[python]>=0.26.1",
    "mkdocs-autorefs>=1.2.0",
]


[tool.coverage.run]
source = ["bqp_database_access"]
omit = [
    "bqp_database_access/_*.py",
    "bqp_database_access/__*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
