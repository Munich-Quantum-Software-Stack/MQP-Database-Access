[project]
name = "bqp-database-access"
version = "0.3.28"
description = ""
authors = [
    { name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de" }, 
    { name = "Tobias Bauer", email = "Tobias.Bauer@lrz.de" }, 
    { name = "Ege Özmeral", email = "Nazim.Oezmeral@lrz.de" },
    { name = "Trang Huynh", email = "Trang.Huynh@lrz.de" }
    ]
dependencies = ["pony>=0.7.19", "bcrypt>=4.0", "psycopg2-binary>=2.9.10", "numpy>=2.2.6", "eliot>=1.17.5", "cffi>=2.0.0", "werkzeug>=3.1.4", "fixture>=1.5.11"]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "mypy>=1.14.1",
    "pylint>=3.3.8",
    "pre-commit>=4.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.isort]
profile = "black"

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "too-many-arguments",
    "too-many-nested-blocks",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-function-args",
    "W0511",
    "import-outside-toplevel",
    "missing-docstring",
    "E1101",
]

[tool.pylint.'SIMILARITIES']
min-similarity-lines = 8
ignore-imports = "yes"

[tool.pylint.'FORMAT']
max-line-length = 95
max-positional-arguments = 10

[tool.black]
target-version = ['py310']

[tool.pytest.ini_options]
env = [
    "QUANTUM_DB_TESTING=TRUE",
    "QUANTUM_DB_FILENAME=test_db.sqlite",
    "QUANTUM_DB_USER=postgres",
    "QUANTUM_DB_PASS=example",
    "QUANTUM_DB_HOST=localhost:5432"
]
pythonpath = ["."]
addopts = [
    "--cov=bqp_database_access",
    "--cov-report=term-missing",
    "--cov-report=xml",
]


[dependency-groups]
test = [
    "pytest>=7.4.2",
    "pytest-cov>=6.2.1",
    "pytest-env>=1.0.1"
]


[tool.coverage.run]
source = ["bqp_database_access"]
omit = [
    "bqp_database_access/_*.py",
    "bqp_database_access/__*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
