[project]
name = "BQP Database Access"
version = "0.1"
description = "Allow access to the Quantum DB for the Bavarian Quantum Portal."
authors = [
    {name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de"},
]
dependencies = [
    "pony>=0.7.16",
    "bcrypt>=4.0.0",
]
requires-python = ">=3.10"
license = {text = "MIT"}

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"

[tool]
[tool.pdm]
