# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: dockerhub.quantum.lrz.de/python-gcc

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  paths:
    - .cache/uv

# https://hub.docker.com/r/library/rabbitmq/tags/

before_script:
  - pip install --no-cache-dir uv
  - uv sync --dev

stages:
  - type_check_and_lint

type_checking:
  stage: type_check_and_lint
  script:
    - uv run mypy bqp_database_access/
    - uv run pylint bqp_database_access/
